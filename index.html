/* Rosa claro: fundo blush, rosa forte de acento, vinho para texto; verde-água só para "feito". Coluna única mobile-first com abas Hoje e Dashboard. */
:root{
  --bg:#fff3f7; --panel:#ffffff; --panel2:#fbe4ec; --line:#f3d3df;
  --ink:#3a1a2a; --muted:#9a6f82; --accent:#e4528e; --accent-deep:#c23a73; --accent-soft:#ffe0ec;
  --ok:#2fa58a; --ok-soft:#dcf3ec; --warn:#c98a1b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--accent-deep);font-weight:700}
h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;box-shadow:0 8px 22px rgba(194,58,115,.12)}
.tabs a{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:9px 0;border-radius:10px;color:var(--muted);text-decoration:none}
.tabs a.on{background:var(--accent);color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .arrow{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px;color:var(--accent-deep)}
.datenav .lbl{font-family:var(--display);font-weight:700;font-size:20px;min-width:118px;text-align:center}
.todaybtn{font-size:12px;font-weight:700;color:var(--accent-deep);padding:6px 10px;border-radius:999px;background:var(--accent-soft)}
.hero{background:linear-gradient(150deg,#ffd9e7 0%,#fff 70%);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:112px;height:112px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.ring .pct span{font-size:11px;color:var(--muted)}
.streak{display:flex;align-items:baseline;gap:8px}
.streak b{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;color:var(--accent)}
.streak span{font-size:13px;color:var(--muted);font-weight:600}
.msg{font-weight:700;margin-top:4px}
.quote{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:14px;font-style:italic}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px;border:1px solid transparent}
.wd.sel{border-color:var(--line);background:var(--panel)}
.wd .dn{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.wd .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:15px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0)}
.wd .dot i{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal}
.wd.full .dot{background:var(--ok)}
.wd.full .dot i{background:var(--ok);color:#fff}
.wd .wk{font-size:10px;color:var(--muted);font-weight:800}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 rgba(194,58,115,.04)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.card-h .side{font-size:13px;color:var(--muted);font-weight:600}
.card-sub{padding:0 16px 12px;font-size:13px;color:var(--muted);margin-top:-4px}
.chip{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.chip.good{background:var(--ok-soft);color:var(--ok)}
.chip.mid{background:#fdf0d6;color:var(--warn)}
.chip.low{background:var(--accent-soft);color:var(--accent-deep)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;flex:none;background:#fff}
.check svg{opacity:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on svg{opacity:1}
.check:active{transform:scale(.9)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.okb{background:var(--ok-soft);border-color:#a9dfcf;color:var(--ok)}
.wsel{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
.wsel button{font-family:var(--display);font-weight:700;font-size:16px;padding:6px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.wsel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wfocus{padding:0 16px 12px;color:var(--muted);font-size:14px}
.wfocus b{color:var(--ink)}
.ex{display:grid;grid-template-columns:28px 1fr 40px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.ex .i{font-family:var(--display);font-size:18px;font-weight:700;color:var(--accent);align-self:start;padding-top:1px}
.ex .en{font-weight:700;font-size:14px}
.ex .es{font-size:13px;opacity:.85}
.ex .et{font-size:12px;color:var(--accent-deep);font-weight:600}
.ex.done .en{color:var(--muted);text-decoration:line-through}
.ld{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ld input{width:84px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:6px 10px;font-variant-numeric:tabular-nums}
.ld .u{font-size:13px;color:var(--muted);font-weight:600}
.ld .prev{font-size:12px;color:var(--muted)}
.ld .prev b{color:var(--ink)}
.wfoot{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wprog{height:6px;background:var(--panel2);margin:0 16px 14px;border-radius:999px;overflow:hidden}
.wprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rest{padding:4px 16px 16px;color:var(--muted)}
.bk{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.bk textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px 10px;resize:vertical}
.bk .row2{display:flex;gap:8px;flex-wrap:wrap}
.dhead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent-deep)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tl{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
.tile .tv{font-family:var(--display);font-size:36px;font-weight:800;line-height:1.05}
.tile .tv small{font-size:16px;color:var(--muted);font-weight:700;margin-left:2px}
.tile .ts{font-size:12px;color:var(--muted)}
.tile .mini{height:5px;border-radius:999px;background:var(--panel2);overflow:hidden;margin-top:6px}
.tile .mini i{display:block;height:100%;background:var(--accent)}
.insight{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.insight div{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:14px}
.insight b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.chart{padding:4px 12px 12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink);stroke-opacity:.4;stroke-width:1.5;stroke-dasharray:4 4}
.chart .reft{fill:var(--ink);fill-opacity:.7;font-weight:700}
.chart .b{fill:var(--accent)}
.chart .b.ok{fill:var(--ok)}
.chart .b.dim{fill:var(--panel2)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);fill-opacity:.12}
.chart .pt{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart .vl{fill:var(--ink);font-weight:700;font-size:11px}
.chart .base{stroke:var(--muted);stroke-opacity:.5}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:10px;padding:2px 16px 16px}
.hb{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.hb .tr{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.hb .tr i.ok{background:var(--ok)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px 10px}
.cal .h{font-size:10px;color:var(--muted);text-align:center;font-weight:700;text-transform:uppercase}
.cal .c{aspect-ratio:1;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.cal .c.fut{background:transparent;border:1px dashed var(--line);cursor:default}
.cal .c.pre{opacity:.35;cursor:default}
.cal .c.off{background:#fff;border:1px solid var(--line)}
.cal .c.part{background:#f7a8c8;color:#fff}
.cal .c.done{background:var(--accent);color:#fff}
.cal .c.tdy{outline:2px solid var(--ink);outline-offset:1px}
.exsel{padding:0 16px 8px}
.exsel select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-weight:600;padding:9px 12px}
.prs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;width:100%}
.pr:last-child{border-bottom:0}
.pr .pn{font-weight:600}
.pr .pk{font-variant-numeric:tabular-nums;color:var(--muted)}
.pr .pp{font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.pr .pp.up{color:var(--ok)}
.empty{padding:6px 16px 18px;color:var(--muted);font-size:14px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:7px 10px;border-radius:9px;box-shadow:0 8px 24px rgba(58,26,42,.25);max-width:240px;white-space:pre-line;display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(194,58,115,.35);animation:pop .4s ease-out;z-index:10;text-align:center;max-width:90vw}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:400px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .streak{justify-content:center}
  .insight div{grid-template-columns:1fr;gap:2px}
  .hb{grid-template-columns:92px 1fr 40px}
  .tile .tv{font-size:32px}
}
</style>

function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fromKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}

  s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+v.l+'</text><rect class="hit" x="'+(pl+step*i)+'" y="'+pt+'" width="'+step+'" height="'+ih+'" data-tip="'+esc(v.tip)+'"/>'});

function svgLine(pts,o){

function showTip(t,x,y){tipEl.textContent=t;tipEl.style.display='block';var r=tipEl.getBoundingClientRect(),l=Math.min(window.innerWidth-r.width-8,Math.max(8,x-r.width/2)),tp=y-r.height-14;if(tp<8)tp=y+18;tipEl.style.left=l+'px';tipEl.style.top=tp+'px'}
function hideTip(){tipEl.style.display='none'}
document.addEventListener('pointermove',function(ev){if(ev.pointerType!=='mouse')return;var t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),ev.clientX,ev.clientY);else hideTip()});
window.addEventListener('scroll',hideTip,{passive:true});

document.addEventListener('click',function(ev){
 var tt=ev.target.closest('[data-tip]');
 if(tt&&!ev.target.closest('[data-act]')){showTip(tt.getAttribute('data-tip'),ev.clientX,ev.clientY);clearTimeout(tipT);tipT=setTimeout(hideTip,2600);return}
 var b=ev.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
 if(a==='tab'){ev.preventDefault();ui.tab=b.getAttribute('data-t');try{history.replaceState(null,'','#'+ui.tab)}catch(e){}render();window.scrollTo(0,0);return}
 if(a==='nav'){var v=+b.getAttribute('data-v');ui.view=v===0?today():addDays(ui.view,v);render();return}
 if(a==='day'){ui.view=b.getAttribute('data-k');render();return}
 if(a==='range'){ui.range=b.getAttribute('data-r');render();return}
 if(a==='pickex'){ui.ex=b.getAttribute('data-lk');render();return}
 if(a==='bk'){ui.bk=!ui.bk;render();return}
 if(a==='bkcopy'){var code='ISA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  var ta=document.getElementById('bkin');
  (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(function(){toast('Código copiado. Guarda num lugar seguro.')}).catch(function(){ta.value=code;ta.select();toast('Seleciona o texto e copia')});return}
 if(a==='bkload'){var raw=document.getElementById('bkin').value.trim();try{if(raw.indexOf('ISA1:')!==0)throw 0;var ns=JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));if(!ns.days)throw 0;state=ns;save();ui.bk=false;render();toast('Dados restaurados!')}catch(e){toast('Código inválido. Confere se copiou inteiro.')}return}
 ev.preventDefault();
 mutate(function(d){
  if(a==='treino')d.treino=d.treino?0:1;
  else if(a==='ex'||a==='cardio'){if(a==='ex'){var i=b.getAttribute('data-i');d.ex=d.ex||{};if(d.ex[i])delete d.ex[i];else d.ex[i]=1}else d.cardio=d.cardio?0:1;
   var w=wkOf(ui.view);if(w!=='OFF'&&S[w].ex.every(function(_,j){return d.ex&&d.ex[j]})&&d.cardio)d.treino=1}
  else if(a==='c50')d.c50=d.c50?0:1;
  else if(a==='wk'){var w2=b.getAttribute('data-w');if(w2===DEF[fromKey(ui.view).getDay()])delete d.wk;else d.wk=w2;d.ex={};d.cardio=0;d.treino=0}
 });
});
document.addEventListener('change',function(ev){
 var el=ev.target;if(el.id==='exsel'){ui.ex=el.value;render();return}
 var lk=el.getAttribute&&el.getAttribute('data-lk');if(!lk)return;var v=parseKg(el.value);if(v!==v){el.value='';return}
 var d=dayW(ui.view);d.load=d.load||{};if(v==null)delete d.load[lk];else d.load[lk]=v;save();
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.getAttribute&&ev.target.getAttribute('data-lk'))ev.target.blur()});
window.addEventListener('hashchange',function(){var t=location.hash==='#dashboard'?'dashboard':'hoje';if(t!==ui.tab){ui.tab=t;render()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ui.view<today()&&ui.view===addDays(today(),-1)){ui.view=today();render()}});
render();
})();
</script>
